<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StreamXOne | Verifying</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

/* LOCK MOBILE DRAG */
html,body{
  height:100%;
  overflow:hidden;
  overscroll-behavior:none;
}

body{
  background: radial-gradient(circle at top, #0a0f1c, #04060c);
  color:white;
  display:flex;
  flex-direction:column;
  position:relative;
}

/* ✅ SMOOTH AMBIENT BACKGROUND (NO MOVEMENT) */
body::before{
  content:"";
  position:fixed;
  inset:0;
  background: radial-gradient(circle at 50% 30%, rgba(125,249,255,0.06), transparent 65%);
  animation: breathe 8s ease-in-out infinite;
  pointer-events:none;
}

/* subtle brightness pulsing instead of movement */
@keyframes breathe{
  0%,100%{ opacity:0.4; }
  50%{ opacity:0.7; }
}

/* HEADER */
header{
  position:fixed;
  top:0;
  width:100%;
  padding:14px;
  text-align:center;
  background:rgba(255,255,255,0.03);
  backdrop-filter:blur(10px);
  border-bottom:1px solid rgba(255,255,255,0.05);
  font-weight:500;
}

/* MAIN */
.main{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  padding-top:70px;
  padding-bottom:70px;
}

/* CARD */
.container{
  width:90%;
  max-width:400px;
  padding:30px 25px;
  border-radius:18px;
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.06);
  backdrop-filter:blur(18px);
  text-align:center;
  animation:fadeUp 0.8s ease;
}

/* TEXT */
h1{
  font-size:1.5rem;
  margin-bottom:8px;
  font-weight:500;
}

.sub{
  font-size:0.9rem;
  opacity:0.6;
  margin-bottom:20px;
}

/* STATUS */
.status{
  font-size:0.85rem;
  opacity:0.7;
  margin-bottom:18px;
  min-height:18px;
}

/* PROGRESS */
.progress{
  width:100%;
  height:5px;
  background:rgba(255,255,255,0.08);
  border-radius:10px;
  overflow:hidden;
}

.progress-bar{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#7df9ff,#ffffff);
  transition:width 0.4s ease;
}

/* PERCENT */
.percent{
  font-size:0.75rem;
  margin-top:8px;
  opacity:0.5;
}

/* FOOTER */
footer{
  position:fixed;
  bottom:0;
  width:100%;
  text-align:center;
  padding:14px;
  font-size:0.75rem;
  opacity:0.5;
  border-top:1px solid rgba(255,255,255,0.05);
}

/* ANIMATION */
@keyframes fadeUp{
  from{opacity:0;transform:translateY(20px);}
  to{opacity:1;transform:translateY(0);}
}

/* MOBILE */
@media(max-width:480px){
  .container{padding:25px 20px;}
  h1{font-size:1.3rem;}
}
</style>
</head>

<body>

<header>
  StreamXOne
</header>

<div class="main">
  <div class="container">
    <h1>Verifying</h1>
    <div class="sub">Please wait while we process your request</div>

    <div class="status" id="status">Starting check...</div>

    <div class="progress">
      <div class="progress-bar" id="bar"></div>
    </div>

    <div class="percent" id="percent">0%</div>
  </div>
</div>

<footer>
  © 2026 StreamXOne • Created by Pranav Sagar ✦
</footer>

<script>
const statusText = document.getElementById("status");
const bar = document.getElementById("bar");
const percentText = document.getElementById("percent");

const steps = [
  "Initializing secure session",
  "Checking connection",
  "Verifying request",
  "Loading environment",
  "Finalizing"
];

let progress = 0;
let stepIndex = 0;

function updateProgress(){
  if(progress < 100){
    progress += Math.random() * 10 + 4;

    if(progress > (stepIndex + 1) * 20 && stepIndex < steps.length - 1){
      stepIndex++;
      statusText.innerText = steps[stepIndex];
    }

    if(progress > 100) progress = 100;

    bar.style.width = progress + "%";
    percentText.innerText = Math.floor(progress) + "%";
  }
}

let interval = setInterval(updateProgress, 350);

setTimeout(()=>{
  clearInterval(interval);
  bar.style.width = "100%";
  percentText.innerText = "100%";
  statusText.innerText = "Redirecting...";

  setTimeout(()=>{
    window.location.href = "https://streamx-one.vercel.app/";
  }, 800);

}, 4200);
</script>

</body>
</html>
